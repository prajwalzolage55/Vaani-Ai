<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Noto+Serif+Devanagari:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .bg { fill: #FAF7F2; }
      .stroke-main { stroke: #1E293B; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-thin { stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
      .stroke-gold { stroke: #D97706; stroke-width: 2; fill: none; }
      .fill-gold { fill: #D97706; }
      .text-deva { font-family: 'Noto Serif Devanagari', serif; font-size: 24px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .text-latin { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700; fill: #D97706; letter-spacing: 4px; text-anchor: middle; }
      .text-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 600; fill: #64748B; letter-spacing: 1.5px; text-anchor: middle; }
      .node-text { font-family: 'Noto Serif Devanagari', serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
    </style>
  </defs>

  <!-- Clean Canvas Background matching Pinterest reference -->
  <rect width="600" height="600" class="bg" />

  <!-- Outer Fine Hairline Framing -->
  <rect x="25" y="25" width="550" height="550" fill="none" stroke="#E2E8F0" stroke-width="1.5" />
  <rect x="35" y="35" width="530" height="530" fill="none" stroke="#CBD5E1" stroke-width="0.8" />

  <!-- Top Headline: Devanagari Shirorekha style typography -->
  <line x1="160" y1="95" x2="440" y2="95" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  <text x="300" y="85" class="text-deva" font-size="28">पाणिनीय शिक्षा</text>
  <text x="300" y="125" class="text-latin">PĀṆINĪYA ŚIKṢĀ</text>
  <text x="300" y="145" class="text-sub">THE CANONICAL FIVE ARTICULATORY SITES</text>

  <!-- Sacred Geometry Concentric Rings -->
  <circle cx="300" cy="300" r="140" class="stroke-thin" />
  <circle cx="300" cy="300" r="105" stroke="#E2E8F0" stroke-width="1.2" fill="none" />
  <circle cx="300" cy="300" r="70" class="stroke-thin" />

  <!-- Center Sacred Geometric Lotus Emblem (matching reference style) -->
  <g transform="translate(300, 300)">
    <!-- Central Sacred Petals -->
    <path d="M 0 -55 C -25 -25, -25 25, 0 50 C 25 25, 25 -25, 0 -55 Z" class="stroke-main" fill="#FFF" />
    <path d="M -50 0 C -25 -25, 25 -25, 50 0 C 25 25, -25 25, -50 0 Z" class="stroke-main" fill="#FFF" />
    <!-- Diagonal Petals -->
    <path d="M -35 -35 C -35 0, 0 35, 35 35 C 35 0, 0 -35, -35 -35 Z" class="stroke-main" stroke-width="1.5" fill="#FFF" />
    <path d="M -35 35 C 0 35, 35 0, 35 -35 C 0 -35, -35 0, -35 35 Z" class="stroke-main" stroke-width="1.5" fill="#FFF" />

    <!-- Core Golden Center Symbol (वा - Vaani) -->
    <circle cx="0" cy="0" r="18" fill="#FFF" stroke="#D97706" stroke-width="2" />
    <text x="0" y="7" font-family="'Noto Serif Devanagari', serif" font-size="16" font-weight="700" fill="#D97706" text-anchor="middle">वा</text>
  </g>

  <!-- The 5 Sthāna Radial Gates (Anatomical Vocal Nodes) -->
  <!-- 1. Kaṇṭha (Throat - Bottom) -->
  <g transform="translate(300, 440)">
    <circle cx="0" cy="0" r="22" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8" />
    <text x="0" y="5" font-family="'Noto Serif Devanagari', serif" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">कण्ठ</text>
    <text x="0" y="38" class="node-text" text-anchor="middle" font-size="11">Kaṇṭha (Velar)</text>
  </g>
  <line x1="300" y1="370" x2="300" y2="418" class="stroke-gold" stroke-dasharray="3 3" />

  <!-- 2. Tālu (Palate - Left) -->
  <g transform="translate(160, 300)">
    <circle cx="0" cy="0" r="22" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.8" />
    <text x="0" y="5" font-family="'Noto Serif Devanagari', serif" font-size="13" font-weight="700" fill="#4338CA" text-anchor="middle">तालु</text>
    <text x="0" y="38" class="node-text" text-anchor="middle" font-size="11">Tālu (Palate)</text>
  </g>
  <line x1="230" y1="300" x2="182" y2="300" stroke="#4338CA" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- 3. Mūrdhā (Palate Roof - Top) -->
  <g transform="translate(300, 195)">
    <circle cx="0" cy="0" r="22" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8" />
    <text x="0" y="5" font-family="'Noto Serif Devanagari', serif" font-size="13" font-weight="700" fill="#DC2626" text-anchor="middle">मूर्धा</text>
    <text x="0" y="-28" class="node-text" text-anchor="middle" font-size="11">Mūrdhā (Retroflex Roof)</text>
  </g>
  <line x1="300" y1="230" x2="300" y2="217" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- 4. Danta (Teeth - Right Upper) -->
  <g transform="translate(425, 230)">
    <circle cx="0" cy="0" r="22" fill="#ECFDF5" stroke="#059669" stroke-width="1.8" />
    <text x="0" y="5" font-family="'Noto Serif Devanagari', serif" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">दन्त</text>
    <text x="0" y="38" class="node-text" text-anchor="middle" font-size="11">Danta (Teeth)</text>
  </g>
  <line x1="370" y1="265" x2="408" y2="242" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- 5. Oṣṭha (Lips - Right Lower) -->
  <g transform="translate(425, 370)">
    <circle cx="0" cy="0" r="22" fill="#FAF5FF" stroke="#9333EA" stroke-width="1.8" />
    <text x="0" y="5" font-family="'Noto Serif Devanagari', serif" font-size="13" font-weight="700" fill="#9333EA" text-anchor="middle">ओष्ठ</text>
    <text x="0" y="38" class="node-text" text-anchor="middle" font-size="11">Oṣṭha (Lips)</text>
  </g>
  <line x1="370" y1="335" x2="408" y2="358" stroke="#9333EA" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Bottom Sacred Emblem & Sutra Seal -->
  <g transform="translate(300, 520)">
    <!-- Minimalist geometric bird/lotus icon matching Pinterest badge -->
    <path d="M 0 -18 C -15 -8, -25 5, 0 16 C 25 5, 15 -8, 0 -18 Z" class="stroke-main" stroke-width="1.6" fill="none" />
    <path d="M -20 -2 C -10 6, -5 12, 0 16 C 5 12, 10 6, 20 -2" class="stroke-main" stroke-width="1.4" fill="none" />
    <text x="0" y="32" font-family="'Noto Serif Devanagari', serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">यथा लिखितं तथा पठितम्</text>
  </g>
</svg>
