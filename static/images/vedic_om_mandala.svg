<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Noto+Serif+Devanagari:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .bg { fill: #FAF7F2; }
      .stroke-main { stroke: #0F172A; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-thin { stroke: #CBD5E1; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
      .text-deva { font-family: 'Noto Serif Devanagari', serif; font-size: 26px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .text-latin { font-family: 'Cinzel', serif; font-size: 14px; font-weight: 700; fill: #D97706; letter-spacing: 4px; text-anchor: middle; }
      .text-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 600; fill: #64748B; letter-spacing: 1.5px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="600" height="600" class="bg" />

  <!-- Outer Frames -->
  <rect x="25" y="25" width="550" height="550" fill="none" stroke="#E2E8F0" stroke-width="1.5" />
  <rect x="35" y="35" width="530" height="530" fill="none" stroke="#CBD5E1" stroke-width="0.8" />

  <!-- Top Title: Shirorekha style -->
  <line x1="160" y1="95" x2="440" y2="95" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  <text x="300" y="85" class="text-deva">गीर्वाणभारती • वाक्</text>
  <text x="300" y="125" class="text-latin">GĪRVĀṆABHĀRATĪ • VĀK</text>
  <text x="300" y="145" class="text-sub">THE DIVINE ARTICULATION OF THE MOTHER TONGUE</text>

  <!-- Sacred Geometry Mandala Grid -->
  <circle cx="300" cy="300" r="140" class="stroke-thin" />
  <circle cx="300" cy="300" r="115" stroke="#E2E8F0" stroke-width="1.2" fill="none" />
  <circle cx="300" cy="300" r="90" class="stroke-thin" />
  <polygon points="300,165 415,365 185,365" stroke="#E2E8F0" stroke-width="1.2" fill="none" />
  <polygon points="300,435 415,235 185,235" stroke="#E2E8F0" stroke-width="1.2" fill="none" />

  <!-- Center Sacred Calligraphy Symbol (ॐ) -->
  <g transform="translate(300, 305)">
    <!-- Central Halo Circle -->
    <circle cx="0" cy="0" r="45" fill="#FFF" stroke="#D97706" stroke-width="2" />
    <text x="0" y="22" font-family="'Noto Serif Devanagari', serif" font-size="64" font-weight="700" fill="#0F172A" text-anchor="middle">ॐ</text>
  </g>

  <!-- Four Directional Sound Seeds -->
  <text x="300" y="180" font-family="'Noto Serif Devanagari', serif" font-size="16" font-weight="700" fill="#D97706" text-anchor="middle">परा</text>
  <text x="430" y="306" font-family="'Noto Serif Devanagari', serif" font-size="16" font-weight="700" fill="#D97706" text-anchor="middle">पश्यन्ती</text>
  <text x="300" y="435" font-family="'Noto Serif Devanagari', serif" font-size="16" font-weight="700" fill="#D97706" text-anchor="middle">मध्यमा</text>
  <text x="170" y="306" font-family="'Noto Serif Devanagari', serif" font-size="16" font-weight="700" fill="#D97706" text-anchor="middle">वैखरी</text>

  <!-- Bottom Sacred Lotus Emblem (matching Pinterest reference) -->
  <g transform="translate(300, 505)">
    <path d="M 0 -22 C -20 -10, -32 5, 0 20 C 32 5, 20 -10, 0 -22 Z" class="stroke-main" stroke-width="1.8" fill="#FFF" />
    <path d="M -25 -2 C -15 8, -6 16, 0 20 C 6 16, 15 8, 25 -2" class="stroke-main" stroke-width="1.4" fill="none" />
    <text x="0" y="42" font-family="'Noto Serif Devanagari', serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">चत्वारि वाक्परिमिता पदानि</text>
  </g>
</svg>
