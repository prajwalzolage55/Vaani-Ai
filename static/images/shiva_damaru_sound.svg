<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Noto+Serif+Devanagari:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .bg { fill: #FAF7F2; }
      .stroke-main { stroke: #0F172A; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-thin { stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
      .text-deva { font-family: 'Noto Serif Devanagari', serif; font-size: 26px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .text-latin { font-family: 'Cinzel', serif; font-size: 14px; font-weight: 700; fill: #D97706; letter-spacing: 4px; text-anchor: middle; }
      .text-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 600; fill: #64748B; letter-spacing: 1.5px; text-anchor: middle; }
      .sutra-pill { font-family: 'Noto Serif Devanagari', serif; font-size: 12px; font-weight: 700; fill: #1E293B; }
    </style>
  </defs>

  <rect width="600" height="600" class="bg" />

  <!-- Double Border Frame -->
  <rect x="25" y="25" width="550" height="550" fill="none" stroke="#E2E8F0" stroke-width="1.5" />
  <rect x="35" y="35" width="530" height="530" fill="none" stroke="#CBD5E1" stroke-width="0.8" />

  <!-- Top Title: Shirorekha style -->
  <line x1="160" y1="95" x2="440" y2="95" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  <text x="300" y="85" class="text-deva">नादब्रह्म • शिव सूत्रम्</text>
  <text x="300" y="125" class="text-latin">NĀDA BRAHMA • 14 SHIVA SŪTRAS</text>
  <text x="300" y="145" class="text-sub">THE PRIMORDIAL ACOUSTIC ORIGIN OF SANSKRIT</text>

  <!-- Concentric Sound Frequency Radiations -->
  <circle cx="300" cy="295" r="145" class="stroke-thin" />
  <circle cx="300" cy="295" r="110" stroke="#E2E8F0" stroke-width="1.2" fill="none" />
  <circle cx="300" cy="295" r="75" class="stroke-thin" />

  <!-- Center Minimalist Geometric Damaru (Hourglass Sound Instrument) -->
  <g transform="translate(300, 295)">
    <!-- Upper Cone -->
    <path d="M -45 -55 L 45 -55 L 0 0 Z" class="stroke-main" fill="#FFF" stroke-width="2.5" />
    <ellipse cx="0" cy="-55" rx="45" ry="12" class="stroke-main" fill="#FFF7ED" stroke-width="2.5" />

    <!-- Lower Cone -->
    <path d="M -45 55 L 45 55 L 0 0 Z" class="stroke-main" fill="#FFF" stroke-width="2.5" />
    <ellipse cx="0" cy="55" rx="45" ry="12" class="stroke-main" fill="#FFF7ED" stroke-width="2.5" />

    <!-- Center Waist Ring & Strands -->
    <rect x="-6" y="-5" width="12" height="10" rx="3" fill="#D97706" stroke="#9A3412" stroke-width="1.5" />
    <path d="M 0 0 Q 35 15, 42 28" class="stroke-main" stroke-width="1.8" />
    <circle cx="42" cy="28" r="5" fill="#D97706" />

    <path d="M 0 0 Q -35 -15, -42 -28" class="stroke-main" stroke-width="1.8" />
    <circle cx="-42" cy="-28" r="5" fill="#D97706" />

    <!-- Acoustic Sound Rays -->
    <line x1="-80" y1="0" x2="-140" y2="0" stroke="#D97706" stroke-width="1.8" stroke-dasharray="4 4" />
    <line x1="80" y1="0" x2="140" y2="0" stroke="#D97706" stroke-width="1.8" stroke-dasharray="4 4" />
  </g>

  <!-- Surrounding Shiva Sutras Chips in Cardinal Directions -->
  <g transform="translate(140, 200)">
    <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#FFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="0" y="5" class="sutra-pill" text-anchor="middle">१. अइउण्</text>
  </g>
  <g transform="translate(460, 200)">
    <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#FFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="0" y="5" class="sutra-pill" text-anchor="middle">२. ऋऌक्</text>
  </g>
  <g transform="translate(130, 390)">
    <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#FFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="0" y="5" class="sutra-pill" text-anchor="middle">४. ऐऔच्</text>
  </g>
  <g transform="translate(470, 390)">
    <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#FFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="0" y="5" class="sutra-pill" text-anchor="middle">१४. हल्</text>
  </g>

  <!-- Bottom Sacred Lotus Emblem (matching Pinterest reference) -->
  <g transform="translate(300, 505)">
    <!-- Central Lotus Flower with Owl/Eye Motif -->
    <path d="M 0 -22 C -20 -10, -32 5, 0 20 C 32 5, 20 -10, 0 -22 Z" class="stroke-main" stroke-width="1.8" fill="#FFF" />
    <path d="M -25 -2 C -15 8, -6 16, 0 20 C 6 16, 15 8, 25 -2" class="stroke-main" stroke-width="1.4" fill="none" />
    <path d="M -38 5 C -25 15, -12 22, 0 22 C 12 22, 25 15, 38 5" stroke="#94A3B8" stroke-width="1.2" fill="none" />
    <!-- Owl Face Silhouette inside Lotus -->
    <circle cx="-5" cy="-2" r="2.5" fill="#0F172A" />
    <circle cx="5" cy="-2" r="2.5" fill="#0F172A" />
    <polygon points="0,2 -3,-1 3,-1" fill="#D97706" />

    <text x="0" y="44" font-family="'Noto Serif Devanagari', serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">ननाद ढक्कां नवपञ्चवारम्</text>
  </g>
</svg>
